<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    
    <h2>Cadastro</h2>
    <input type="email" id="registerEmail" placeholders="Email">
    <input type="password" id="registerPassword" placeholder="Senha">
    <button onclick="register()">Cadastrar</button>

    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholders="Email">
    <input type="password" id="loginPassword" placeholder="Senha">
    <button onclick="login()">Login</button>

    <h2>Perfil</h2>
    <button onclick="getProfile()">Buscar perfil</button>

    <pre id="output"></pre>

    <script src="js/app.js"></script>

</body>
</html>

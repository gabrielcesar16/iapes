<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>

    <div id="userEmail"></div>
    <br>
    <button id="configBtn">Meus dados</button>
    <br>
    <button id="logoutBtn">Sair</button>
    <br>
    <h3>Minhas Disciplinas</h3>
    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Carga Horária</th>
                <th>Semestre</th>
                <th>Status</th>
                <th>Faltas</th>
                <th>Nota</th>
            </tr>
        </thead>
        <tbody id="tabelaMatriculas"></tbody>
    </table>

    <h3>Disciplinas do Curso</h3>
    <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Carga Horária</th>
                <th>Semestre</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody id="tabelaDisciplinas"></tbody>
    </table>

    <button 
        id = "chatBtn"
        style="
        position:fixed;
        bottom:20px;
        right:20px;
        width:60px;
        height:60px;
    ">
        ZÉ
    </button>

    <div id="chat" style="
        display: none;
        position: fixed;
        bottom: 90px;
        right: 20px;
        width: 280px;
        height: 350px;
        border: 1px solid black;
        background: white;
         padding: 10px;
        ">
             <iframe
                src="chat.html"
                width="100%"
                height="100%"
                style="border:none"
            ></iframe>

    </div>


    <script type="module" src="../js/pages/dashboard.js"></script>
</body>
</html>
